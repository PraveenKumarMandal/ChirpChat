services:
  - type: web
    runtime: node
    name: chirpchat-api
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        value: chirpchat404@gmail.com
      - key: AUTH_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_SERVER_URL
        value: https://chirpchat-api.onrender.com
      - key: UPLOADS_DIR
        value: /var/data/chirpchat-uploads
      - key: UPLOAD_MAX_FILE_SIZE_MB
        value: 15
    disk:
      name: chirpchat-uploads
      mountPath: /var/data/chirpchat-uploads
      sizeGB: 1
